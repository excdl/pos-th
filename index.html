<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生鮮團購商城</title>

<style>

/* ===== 通用 ===== */
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Microsoft JhengHei",Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:1em;
  padding-bottom:120px;
}

/* ===== Header ===== */
.shop-header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:.6em 1em;
  display:flex;
  align-items:center;
  gap:1em;
  flex-wrap:wrap;
}

.logo{
  font-size:1.5em;
  font-weight:bold;
  color:#ee4d2d;
}

.search-bar{
  flex:1;
  display:flex;
  background:#f1f1f1;
  border-radius:6px;
  overflow:hidden;
}

.search-bar input{
  flex:1;
  border:none;
  padding:.7em;
  background:none;
  outline:none;
  font-size:.95em;
}

.search-bar button{
  border:none;
  background:#ee4d2d;
  color:#fff;
  padding:0 1.2em;
  font-size:1em;
  cursor:pointer;
}

.header-cart{
  cursor:pointer;
  font-weight:bold;
  position:relative;
  font-size:1.3em;
}

.header-cart span{
  position:absolute;
  top:-8px;
  right:-8px;
  background:#ee4d2d;
  color:#fff;
  padding:2px 6px;
  border-radius:12px;
  font-size:.8em;
}

#greeting{
  width:100%;
  font-size:.92em;
  color:#666;
}

/* ===== Toolbar ===== */
.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap;
}

select,input{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* ===== Categories ===== */
.categories{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:1em;
}

.category-btn{
  padding:.45em 1em;
  border-radius:20px;
  border:none;
  cursor:pointer;
  background:#eee;
  transition:.2s;
}

.category-btn.active{
  background:#ee4d2d;
  color:#fff;
}

/* ===== Products ===== */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:1em;
}

.product-card{
  background:#fff;
  border-radius:8px;
  padding:.8em;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  transition:.25s;
  position:relative;
}

.product-card:hover{
  transform:translateY(-4px);
  box-shadow:0 6px 18px rgba(0,0,0,.15);
}

.product-card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:6px;
}

.product-card h4{
  font-size:.95em;
  line-height:1.3;
  height:2.6em;
  overflow:hidden;
  margin:.5em 0;
}

.product-card p{
  margin:4px 0;
  color:#666;
  font-size:.85em;
}

.price{
  color:#ee4d2d;
  font-weight:bold;
  font-size:1.1em;
}

/* ✔ 標記 */
.added-check{
  position:absolute;
  top:8px;
  right:8px;
  background:#27ae60;
  color:#fff;
  padding:4px 6px;
  font-size:.8em;
  border-radius:6px;
  display:none;
}

/* ===== Quantity ===== */
.quantity-control{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  flex-wrap:wrap;
}

.quantity-control button{
  width:30px;
  height:30px;
  background:#7ed6df;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:1em;
}

.quantity-control span{
  min-width:28px;
  text-align:center;
}

/* ===== Add Cart ===== */
.add-cart{
  flex:1;
  height:32px;
  border:none;
  border-radius:6px;
  background:#ee4d2d !important;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.add-cart.active{
  background:#27ae60 !important;
}

/* ===== Cart Bar ===== */
#cartBar{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  background:#fff;
  box-shadow:0 -2px 8px rgba(0,0,0,.12);
  display:none;
  align-items:center;
  justify-content:space-between;
  padding:12px 20px;
  z-index:999;
}

#viewCartBtn{
  background:#ee4d2d;
  color:#fff;
  border:none;
  padding:12px 24px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

/* ===== Modal ===== */
.modal{
  display:none;
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.6);
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.modal-content{
  background:#fff;
  width:95%;
  max-width:600px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:10px;
  padding:1.5em;
  position:relative;
}

.modal-close{
  position:absolute;
  top:10px;
  right:15px;
  font-size:1.4em;
  cursor:pointer;
}

#cartItems div{
  padding:10px 0;
  border-bottom:1px solid #eee;
}

#checkoutBtn{
  width:100%;
  background:#ee4d2d;
  color:#fff;
  border:none;
  padding:14px;
  border-radius:8px;
  cursor:pointer;
  font-size:1em;
  margin-top:12px;
}

/* ===== Loading ===== */
#loadingOverlay{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.9);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10000;
  font-size:1.2em;
}

@media(max-width:600px){

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:.7em;
  }

  .product-card img{
    height:140px;
  }

}
  /* ===== Cart Item ===== */
.cart-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.cart-left{
  flex:1;
}

.cart-name{
  font-weight:bold;
  margin-bottom:4px;
}

.cart-price{
  color:#ee4d2d;
  font-size:.9em;
}

.cart-actions{
  display:flex;
  align-items:center;
  gap:6px;
}

.cart-actions button{
  width:28px;
  height:28px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#f1f1f1;
  font-size:1em;
}

.remove-btn{
  background:#ff4d4f !important;
  color:white;
}

/* ===== 收貨資訊排版 ===== */
.receiver-row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.receiver-row input{
  flex:1;
}

.receiver-address{
  width:100%;
}

select,
input{

  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;

  font-size:16px;

  min-height:50px;

}

/* ===== 結帳下拉框放大 ===== */
#paymentMethod,
#deliveryMethod,
#pickupStore{

  width:100%;

  min-height:56px;

  padding:12px 16px;

  font-size:16px;

  border-radius:10px;

  cursor:pointer;

}

/* ===== 點擊區域放大 ===== */
#paymentMethod option,
#deliveryMethod option,
#pickupStore option{

  font-size:16px;

  padding:12px;

}

</style>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>

<body>

<div id="loadingOverlay">
  載入中...
</div>

<!-- Header -->
<header class="shop-header">

  <div class="header-inner">

    <div class="logo">
      SHOP
    </div>

    <div class="search-bar">
      <input type="text" placeholder="搜尋商品..." id="searchInput">
      <button>🔍</button>
    </div>

    <div class="header-cart" id="openCartTop">
      🛒
      <span id="cartCount">0</span>
    </div>

    <div id="greeting">
      您好，會員
    </div>

  </div>

</header>

<!-- Content -->
<div class="container">

  <div class="categories" id="categoryContainer"></div>

  <div class="products" id="productContainer"></div>

</div>

<!-- Bottom Cart -->
<div id="cartBar">

  <div id="cartInfo">
    訂單小計：0 元
  </div>

  <button id="viewCartBtn">
    去結帳
  </button>

</div>

<!-- Cart Modal -->
<div class="modal" id="cartModal">

  <div class="modal-content">

    <span class="modal-close" id="cartClose">
      &times;
    </span>

    <h2>購物車</h2>

    <div id="cartItems"></div>

    <h3>
      總額：
      <span style="color:#ee4d2d;">
        $<span id="cartTotal">0</span>
      </span>
    </h3>

    <h4>付款方式</h4>

    <select id="paymentMethod">
      <option value="現金">現金</option>
      <option value="信用卡">信用卡</option>
      <option value="Line Pay">Line Pay</option>
    </select>

    <h4>取貨方式</h4>

    <select id="deliveryMethod">
      <option value="" selected disabled>
        請選擇取貨方式
      </option>
      <option value="自取">自取</option>
      <option value="外送">外送</option>
    </select>

    <div id="selfPickup" style="display:none;">

      <p>選擇取貨門市</p>

      <select id="pickupStore"></select>

    </div>

    <div id="deliveryForm" style="display:none;">

  <p>請輸入收貨資訊</p>

  <div class="receiver-row">

    <input
      type="text"
      id="receiverName"
      placeholder="姓名">

    <input
      type="text"
      id="receiverPhone"
      placeholder="電話">

  </div>

  <input
    type="text"
    id="receiverAddress"
    class="receiver-address"
    placeholder="地址">

</div>

    <button id="checkoutBtn">
      立即結帳
    </button>

  </div>

</div>

<script>

/* ===== API ===== */
const API_URL =
"https://script.google.com/macros/s/AKfycbz1ABn6SsFcHmOlbz-cOxpllhKybMRFCG27b6FpJANht6jqF22BCbC0sBBX5sfCXgd2EA/exec";

let products = [],
    categories = [],
    cart = [],
    userId = "",
    userName = "",
    pickupStores = [];

let searchTimer;

/* ===== LIFF ===== */
async function initLIFF(){

  await liff.init({
    liffId:"2008573741-WGE2G7lZ"
  });

  if(liff.isLoggedIn()){

    const profile = await liff.getProfile();

    userId = profile.userId;
    userName = profile.displayName;

    document.getElementById("greeting").textContent =
      `${userName} 您好`;

  }else{

    liff.login();

  }
}

/* ===== 商品 ===== */
async function fetchProducts(){

  try{

    const [productRes, storeRes] = await Promise.all([
      fetch(API_URL + "?action=products"),
      fetch(API_URL + "?action=stores")
    ]);

    products = await productRes.json();

    pickupStores = await storeRes.json();

    categories = [
      ...new Set(products.map(p => p['類別']))
    ].filter(Boolean);

    renderCategories();

    if(categories[0]){
      renderProducts(categories[0]);
    }

    const storeSelect =
      document.getElementById("pickupStore");

    storeSelect.innerHTML = `
      <option value="">
        請選擇門市
      </option>
    `;

    pickupStores.forEach(s=>{

      const opt = document.createElement("option");

      opt.value = s;
      opt.textContent = s;

      storeSelect.appendChild(opt);

    });

  }catch(e){

    console.error(e);

    alert("商品載入失敗");

  }

  document.getElementById("loadingOverlay")
  .style.display = "none";
}

/* ===== 分類 ===== */
function renderCategories(){

  const container =
    document.getElementById("categoryContainer");

  container.innerHTML = "";

  categories.forEach(cat=>{

    const btn = document.createElement("button");

    btn.className = "category-btn";

    btn.textContent = cat;

    btn.onclick = ()=>{

      document.querySelectorAll(".category-btn")
      .forEach(b=>b.classList.remove("active"));

      btn.classList.add("active");

      renderProducts(cat);
    }

    container.appendChild(btn);

  });

  if(container.firstChild){
    container.firstChild.classList.add("active");
  }
}

/* ===== 商品渲染 ===== */
function renderProducts(category){

  const container =
    document.getElementById("productContainer");

  container.innerHTML = "";

  const keyword =
    document.getElementById("searchInput")
    .value
    .trim();

  products
  .filter(p=>{

    const matchKeyword =
      p['商品名稱']
      ?.toLowerCase()
      .includes(keyword.toLowerCase());

    // 有搜尋字 → 全商品搜尋
    if(keyword){
      return matchKeyword;
    }

    // 沒搜尋字 → 依分類
    return p['類別']?.trim() === category?.trim();

  })
  .forEach(p=>{

    const idName =
      encodeURIComponent(p['商品名稱']);

    const card =
      document.createElement("div");

    card.className = "product-card";

    card.innerHTML = `

      <div class="added-check" id="check-${idName}">
        ✓ 已加入
      </div>

      <img
        src="${p['商品照片']}"
        loading="lazy"
        decoding="async">

      <h4>${p['商品名稱']}</h4>

      <p>${p['特色說明'] || ''}</p>

      <div class="price">
        $${p['售價']}
      </div>

      <div class="quantity-control">

        <button onclick="changeQty('${idName}',-1)">
          -
        </button>

        <span id="qty-${idName}">
          1
        </span>

        <button onclick="changeQty('${idName}',1)">
          +
        </button>

        <button
          class="add-cart"
          onclick="addToCartWithAnimation('${idName}',this)">
          加入
        </button>

      </div>
    `;

    container.appendChild(card);

  });
}

/* ===== 搜尋 debounce ===== */
document.getElementById("searchInput")
.addEventListener("input",()=>{

  clearTimeout(searchTimer);

  searchTimer = setTimeout(()=>{

    const active =
      document.querySelector(".category-btn.active");

    if(active){
      renderProducts(active.textContent);
    }

  },300);

});

/* ===== 數量 ===== */
function changeQty(idName,delta){

  const span =
    document.getElementById(`qty-${idName}`);

  let qty = parseInt(span.textContent);

  qty += delta;

  if(qty < 1){
    qty = 1;
  }

  span.textContent = qty;
}

/* ===== 加入購物車 ===== */
function addToCartWithAnimation(idName,btn){

  const name =
    decodeURIComponent(idName);

  const qty = parseInt(
    document.getElementById(`qty-${idName}`)
    .textContent
  );

  const product =
    products.find(
      p => p['商品名稱'] === name
    );

  const existIndex =
    cart.findIndex(c => c.name === name);

  if(existIndex !== -1){

    cart[existIndex].quantity += qty;

  }else{

    cart.push({
      name,
      quantity:qty,
      price:parseInt(product['售價']),
      category:product['類別']
    });

  }

  btn.classList.add("active");

  btn.textContent = "已加";

  document.getElementById(`check-${idName}`)
  .style.display = "block";

  updateCartBar();
}

/* ===== 更新購物車 ===== */
function updateCartBar(){

  const cartBar =
    document.getElementById("cartBar");

  if(cart.length === 0){

    cartBar.style.display = "none";

    document.getElementById("cartCount")
    .textContent = "0";

    return;
  }

  const total =
    cart.reduce((sum,i)=>
      sum + i.quantity * i.price
    ,0);

  document.getElementById("cartInfo")
  .innerHTML =
  `訂單小計：
    <span style="color:#ee4d2d;font-weight:bold;">
      ${total} 元
    </span>`;

  document.getElementById("cartCount")
  .textContent = cart.length;

  cartBar.style.display = "flex";
}

/* ===== Modal ===== */
const cartModal =
  document.getElementById("cartModal");

document.getElementById("viewCartBtn")
.onclick = ()=>{

  renderCart();

  cartModal.style.display = "flex";
}

document.getElementById("openCartTop")
.onclick = ()=>{

  renderCart();

  cartModal.style.display = "flex";
}

document.getElementById("cartClose")
.onclick = ()=>{

  cartModal.style.display = "none";
}

/* ===== render cart ===== */
function renderCart(){

  const container =
    document.getElementById("cartItems");

  container.innerHTML = "";

  let total = 0;

  cart.forEach((item,index)=>{

    const subtotal =
      item.price * item.quantity;

    total += subtotal;

    const div =
      document.createElement("div");

    div.className = "cart-row";

    div.innerHTML = `

      <div class="cart-left">

        <div class="cart-name">
          ${item.name}
        </div>

        <div class="cart-price">
          $${item.price} x ${item.quantity}
          = $${subtotal}
        </div>

      </div>

      <div class="cart-actions">

        <button onclick="changeCartQty(${index},-1)">
          -
        </button>

        <span>${item.quantity}</span>

        <button onclick="changeCartQty(${index},1)">
          +
        </button>

        <button
          class="remove-btn"
          onclick="removeCartItem(${index})">
          ✕
        </button>

      </div>
    `;

    container.appendChild(div);

  });

  document.getElementById("cartTotal")
  .textContent = total;
}

/* ===== 修改購物車數量 ===== */
function changeCartQty(index,delta){

  cart[index].quantity += delta;

  if(cart[index].quantity <= 0){

    cart.splice(index,1);

  }

  renderCart();

  updateCartBar();
}

/* ===== 刪除商品 ===== */
function removeCartItem(index){

  cart.splice(index,1);

  renderCart();

  updateCartBar();
}

/* ===== 使用者資料 ===== */
async function fetchUserData(){

  if(!userId) return;

  try{

    const res =
      await fetch(
        API_URL +
        "?action=getUser&userId=" + userId
      );

    const result =
      await res.json();

    if(result.user){

      document.getElementById("receiverName")
      .value = result.user.name || "";

      document.getElementById("receiverPhone")
      .value = result.user.phone || "";

      document.getElementById("receiverAddress")
      .value = result.user.address || "";

    }

  }catch(err){

    console.error(err);

  }
}

/* ===== 取貨 ===== */
document.getElementById("deliveryMethod")
.onchange = function(){

  const val = this.value;

  if(val === "自取"){

    document.getElementById("selfPickup")
    .style.display = "block";

    document.getElementById("deliveryForm")
    .style.display = "none";

  }else if(val === "外送"){

    document.getElementById("selfPickup")
    .style.display = "none";

    document.getElementById("deliveryForm")
    .style.display = "block";

    fetchUserData();

  }else{

    document.getElementById("selfPickup")
    .style.display = "none";

    document.getElementById("deliveryForm")
    .style.display = "none";
  }
}

/* ===== 結帳 ===== */
document.getElementById("checkoutBtn")
.onclick = async function(){

  const checkoutBtn =
    document.getElementById("checkoutBtn");

  // 防止重複點擊
  if(checkoutBtn.disabled){
    return;
  }

  // 按鈕鎖定
  checkoutBtn.disabled = true;

  checkoutBtn.textContent = "結帳中...";

  checkoutBtn.style.opacity = ".7";

  checkoutBtn.style.cursor = "not-allowed";

  try{

    if(cart.length === 0){

      alert("購物車是空的");

      return;
    }

    const totalAmount =
      cart.reduce(
        (sum,i)=>
          sum + i.price * i.quantity,
        0
      );

    const deliveryMethod =
      document.getElementById("deliveryMethod")
      .value;

    if(!deliveryMethod){

      alert("請選擇取貨方式");

      return;
    }

    let shippingFee = 0,
        receiverName = "",
        receiverPhone = "",
        receiverAddress = "",
        pickupStore = "";

    if(deliveryMethod === "外送"){

      if(totalAmount < 1500){

        alert("外送金額需達1500元以上");

        return;
      }

      receiverName =
        document.getElementById("receiverName")
        .value
        .trim();

      receiverPhone =
        document.getElementById("receiverPhone")
        .value
        .trim();

      receiverAddress =
        document.getElementById("receiverAddress")
        .value
        .trim();

      if(
        !receiverName ||
        !receiverPhone ||
        !receiverAddress
      ){

        alert("請完整填寫收件資訊");

        return;
      }

    }else{

      pickupStore =
        document.getElementById("pickupStore")
        .value;

      if(!pickupStore){

        alert("請選擇取貨門市");

        return;
      }
    }

    const paymentMethod =
      document.getElementById("paymentMethod")
      .value;

    const data = {
      userId,
      userName,
      totalAmount,
      shippingFee,
      paymentMethod,
      deliveryMethod,
      receiverName,
      receiverPhone,
      receiverAddress,
      pickupStore,
      items:cart
    };

    const resOrder =
      await fetch(API_URL,{
        method:'POST',
        body:JSON.stringify(data)
      });

    const resultOrder =
      await resOrder.json();

    alert(
      "訂單完成，單號：" +
      resultOrder.orderId
    );

    if(resultOrder.flexMsg){

      try{

        await liff.sendMessages([{
          type:"flex",
          altText:"訂單完成 🛒",
          contents:resultOrder.flexMsg
        }]);

      }catch(err){

        console.error(err);

      }
    }

    // 重設商城
    resetShop();

  }catch(err){

    console.error(err);

    alert("結帳失敗，請稍後再試");

  }finally{

    // 恢復按鈕
    checkoutBtn.disabled = false;

    checkoutBtn.textContent = "立即結帳";

    checkoutBtn.style.opacity = "1";

    checkoutBtn.style.cursor = "pointer";

  }
}

/* ===== 重設商城 ===== */
function resetShop(){

  // 清空購物車
  cart = [];

  updateCartBar();

  // 關閉 modal
  cartModal.style.display = "none";

  // 清空購物車
  document.getElementById("cartItems")
  .innerHTML = "";

  document.getElementById("cartTotal")
  .textContent = "0";

  // 重設付款
  document.getElementById("paymentMethod")
  .selectedIndex = 0;

  // 重設取貨
  document.getElementById("deliveryMethod")
  .selectedIndex = 0;

  // 隱藏區塊
  document.getElementById("selfPickup")
  .style.display = "none";

  document.getElementById("deliveryForm")
  .style.display = "none";

  // 清空收件資料
  document.getElementById("receiverName")
  .value = "";

  document.getElementById("receiverPhone")
  .value = "";

  document.getElementById("receiverAddress")
  .value = "";

  // 重設門市
  document.getElementById("pickupStore")
  .selectedIndex = 0;

  // 商品數量恢復
  document.querySelectorAll(".quantity-control span")
  .forEach(span=>{

    span.textContent = "1";

  });

  // 按鈕恢復
  document.querySelectorAll(".add-cart")
  .forEach(btn=>{

    btn.classList.remove("active");

    btn.textContent = "加入";

  });

  // 勾勾恢復
  document.querySelectorAll(".added-check")
  .forEach(check=>{

    check.style.display = "none";

  });

  // 搜尋清空
  document.getElementById("searchInput")
  .value = "";

  // 回第一分類
  const firstCategory =
    document.querySelector(".category-btn");

  if(firstCategory){

    document.querySelectorAll(".category-btn")
    .forEach(btn=>{

      btn.classList.remove("active");

    });

    firstCategory.classList.add("active");

    renderProducts(firstCategory.textContent);
  }
}
